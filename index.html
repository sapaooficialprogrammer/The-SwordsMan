<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The SwordsMan</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050609;color:#eee;font-family:Arial,sans-serif}button{font:inherit}.screen{position:fixed;inset:0}.hidden{display:none!important}#menu{display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#32313a 0,#11131a 35%,#050609 75%)}.box{width:min(900px,92vw);padding:56px;border:1px solid #6d6049;background:linear-gradient(135deg,#101217ee,#090a0dee);box-shadow:0 20px 80px #000}.k{letter-spacing:.32em;color:#999;font-size:12px}.logo{font:72px Georgia,serif;line-height:.9;margin:12px 0;color:#eee;text-shadow:0 4px 20px #000}.logo span{display:block;color:#d7b46b;font-size:30px;margin-top:15px;letter-spacing:.08em}.desc{max-width:620px;color:#bbb;line-height:1.5}.btn{display:block;width:320px;text-align:left;margin:8px 0;padding:14px 18px;color:#ddd;background:#101217;border:1px solid #343942;cursor:pointer}.btn:hover{border-color:#9e8148;color:#e7c985}#game{width:100%;height:100%;display:block;background:#111}#hud{position:absolute;inset:0;pointer-events:none}.hud{position:absolute;top:18px;left:18px;width:290px;padding:12px;background:#090b0dcc;border:1px solid #5b5140}.bar{height:12px;background:#171a1f;border:1px solid #4c5158;margin:5px 0 10px}.fill{height:100%}#hp{background:#7f302e}#st{background:#8d733a}.right{position:absolute;top:18px;right:18px;padding:12px 16px;background:#090b0dcc;border:1px solid #5b5140}.title{position:absolute;top:22px;left:50%;transform:translateX(-50%);padding:8px 14px;background:#090b0dcc;border-bottom:1px solid #7e6840;font-family:Georgia,serif}.dialog{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(780px,88vw);padding:20px;background:#0b0d10ee;border:1px solid #7c6740;font:18px Georgia,serif;line-height:1.45}.small{font:12px Arial,sans-serif;color:#92969b;margin-top:10px;text-align:right}.pause{position:absolute;inset:0;display:grid;place-items:center;background:#050609d9;backdrop-filter:blur(6px)}.panel{width:min(650px,90vw);padding:30px;background:#11141a;border:1px solid #6f6046}.panel h2{font:38px Georgia,serif;margin:0 0 10px}.controls{line-height:1.9;color:#ccc}.grain{position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:repeating-radial-gradient(circle at 20% 30%,#fff0 0 1px,#fff2 2px,#0000 3px);mix-blend-mode:soft-light}.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px #000b}</style></head><body><section id="menu" class="screen"><div class="box"><div class="k">UMA AVENTURA DE ESPADA E RUÍNA</div><div class="logo">THE<br>SWORDSMAN<span>UMA COROA QUEBRADA</span></div><p class="desc">Valdora caiu. Sete regiões separam Kael da Fortaleza Negra e de Vharos, o Regente Cinzento. Esta é a build web pública do projeto.</p><button class="btn" id="new">NOVO JOGO</button><button class="btn" id="cont">CONTINUAR</button><button class="btn" id="chap">SELEÇÃO DE FASE</button><button class="btn" id="ctrl">CONTROLES</button></div></section><section id="play" class="screen hidden"><canvas id="game"></canvas><div class="grain"></div><div class="vig"></div><div id="hud"><div class="hud"><b>KAEL</b><div>Vitalidade <span id="hptxt"></span></div><div class="bar"><div id="hp" class="fill"></div></div><div>Fôlego</div><div class="bar"><div id="st" class="fill"></div></div></div><div class="right">Poções: <b id="pots">2</b> · Marcos: <b id="coins">0</b></div><div class="title" id="ltitle"></div><div id="dialog" class="dialog hidden"></div></div><div id="pause" class="pause hidden"><div class="panel"><h2>Pausa</h2><div id="ptext"></div><button class="btn" id="resume">Continuar</button><button class="btn" id="back">Menu principal</button></div></div></section><div id="overlay" class="pause hidden"><div class="panel"><h2 id="ovtitle"></h2><div id="ovbody"></div><button class="btn" id="ovclose">Voltar</button></div></div><script>const $=s=>document.querySelector(s),cv=$('#game'),x=cv.getContext('2d');let W,H,scene='menu',li=0,cam=0,paused=false,keys={},pressed={};const L=[['Estrada do Guardião','#263733','#53635a',3900],['Ruínas de Cinza','#48312e','#7c5448',4300],['Profundezas de Cristal','#1d2e43','#4b718d',4600],['Capela Afogada','#25343a','#4f6668',4400],['Bastião de Ferro','#393837','#6a6760',5000],['Ponte da Lua','#20263b','#56617e',4700],['Fortaleza Negra','#251b24','#673c48',4100]];let S={hp:120,max:120,st:100,p:2,c:0,l:0,cp:80,save:false},P,E=[],particles=[],boss=null;function save(){S.save=true;S.l=li;localStorage.setItem('tsmGH',JSON.stringify(S))}function load(){try{Object.assign(S,JSON.parse(localStorage.getItem('tsmGH'))||{})}catch(e){}}function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}onresize=resize;resize();onkeydown=e=>{if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;if(['Space','ArrowUp'].includes(e.code))e.preventDefault()};onkeyup=e=>keys[e.code]=0;function showGame(){scene='game';$('#menu').classList.add('hidden');$('#play').classList.remove('hidden')}function msg(t){let d=$('#dialog');d.innerHTML=t+'<div class="small">E / ENTER para continuar</div>';d.classList.remove('hidden');paused=true}function closeMsg(){if(!$('#dialog').classList.contains('hidden')){$('#dialog').classList.add('hidden');paused=false;return true}return false}function mkLevel(i,at=80){li=i;let l=L[i];P={x:at,y:H-190,vx:0,vy:0,w:34,h:66,face:1,ground:false,atk:0,roll:0,ifr:0};S.cp=at;E=[];for(let n=0;n<9+(i%3);n++)E.push({x:430+n*(l[3]-700)/9,y:H-178,w:36,h:56,hp:38+i*8,vx:0,dead:false,type:n%4});boss=i===6?{x:3500,y:H-220,w:72,h:108,hp:430,max:430,cool:0}:null;cam=Math.max(0,at-W*.35);$('#ltitle').textContent=(i+1)+' · '+l[0];msg(['A velha estrada ainda carrega as marcas do cerco.','O vilarejo foi queimado para que a fome terminasse a batalha.','Nas minas, os cristais cantam com vozes que não pertencem aos vivos.','A água cobre o altar, mas as velas continuam acesas.','As máquinas ainda fabricam armas para um exército morto.','A ponte foi feita para reis que tinham medo de olhar para baixo.','Vharos espera no salão onde a coroa foi quebrada.'][i]);save()}function start(i=0){showGame();paused=false;mkLevel(i)}function collideFloor(o){let floor=H-105;if(o.y+o.h>=floor){o.y=floor-o.h;o.vy=0;o.ground=true}else o.ground=false}function hit(a,b){return a.x<a.x+a.w&&a.x+a.w>b.x&&a.x<b.x+b.w&&a.y+a.h>b.y&&a.y<b.y+b.h}function hurt(d){if(P.ifr>0)return;S.hp-=d;P.ifr=50;P.vx=-P.face*6;shake=8;if(S.hp<=0){S.hp=S.max;P.x=S.cp;P.y=H-190;cam=Math.max(0,P.x-W*.35);msg('Você caiu. O último Marco de Vigília reacende sua chama.')}}let shake=0;function attack(dmg,reach){let a={x:P.face>0?P.x+P.w:P.x-reach,y:P.y+8,w:reach,h:50};for(let e of E)if(!e.dead&&hit(a,e)){e.hp-=dmg;e.vx=P.face*5;burst(e.x,e.y,'#8d3c39');if(e.hp<=0){e.dead=true;S.c+=5}}if(boss&&boss.hp>0&&hit(a,boss)){boss.hp-=dmg;shake=10;burst(boss.x,boss.y,'#a03c48');if(boss.hp<=0)msg('Vharos cai. A coroa permanece no chão, esperando uma mão que conheça o seu peso.')}}function burst(px,py,c){for(let i=0;i<10;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:30,c})}function update(){if(scene!=='game'||paused)return;let l=L[li];let left=keys.KeyA||keys.ArrowLeft,right=keys.KeyD||keys.ArrowRight;if(left){P.vx-=.7;P.face=-1}if(right){P.vx+=.7;P.face=1}P.vx*=.82;P.vx=Math.max(-5,Math.min(5,P.vx));if((pressed.Space||pressed.KeyW||pressed.ArrowUp)&&P.ground){P.vy=-12}if((pressed.ShiftLeft||pressed.ShiftRight)&&S.st>=24){P.vx=P.face*11;P.roll=14;P.ifr=18;S.st-=24}if(pressed.KeyJ&&S.st>=8){P.atk=12;S.st-=8;attack(18,62)}if(pressed.KeyK&&S.st>=18){P.atk=18;S.st-=18;attack(34,82)}if(pressed.KeyH&&S.p>0&&S.hp<S.max){S.p--;S.hp=Math.min(S.max,S.hp+55)}S.st=Math.min(100,S.st+.35);P.vy+=.65;P.x+=P.vx;P.y+=P.vy;collideFloor(P);P.x=Math.max(0,Math.min(l[3]-P.w,P.x));if(P.ifr>0)P.ifr--;if(P.atk>0)P.atk--;for(let e of E){if(e.dead)continue;let d=P.x-e.x;e.vx+=Math.sign(d)*.08;e.vx*=.92;e.x+=e.vx;if(Math.abs(d)<45&&Math.abs(P.y-e.y)<70)hurt(8+li*1.4)}if(boss&&boss.hp>0){let d=P.x-boss.x;boss.x+=Math.sign(d)*(1.4+li*.05);if(Math.abs(d)<70)hurt(15);boss.cool++;if(boss.cool>100){boss.cool=0;particles.push({x:boss.x,y:boss.y+30,vx:Math.sign(d)*8,vy:0,l:120,c:'#c74b59',proj:1})}}for(let q of particles){q.x+=q.vx;q.y+=q.vy;if(!q.proj)q.vy+=.15;q.l--;if(q.proj&&Math.abs(q.x-P.x)<25&&Math.abs(q.y-P.y)<50){hurt(18);q.l=0}}particles=particles.filter(q=>q.l>0);cam+=(Math.max(0,Math.min(l[3]-W,P.x-W*.38))-cam)*.08;if(P.x>l[3]-80){if(li<6)mkLevel(li+1);else msg('A jornada terminou. Valdora verá outro amanhecer.')}if(shake>0)shake*=.8;$('#hp').style.width=S.hp/S.max*100+'%';$('#st').style.width=S.st+'%';$('#hptxt').textContent=Math.ceil(S.hp)+'/'+S.max;$('#pots').textContent=S.p;$('#coins').textContent=S.c;$('#ptext').textContent=L[li][0]}function draw(){if(scene!=='game')return;let l=L[li],sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,l[1]);g.addColorStop(.72,'#15171d');g.addColorStop(1,'#08090b');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.translate(sx,sy);for(let i=-1;i<10;i++){let xx=i*220-(cam*.16%220),hh=120+(i*53%150);x.fillStyle='#0b0d12aa';x.fillRect(xx,H-105-hh,170,hh)}x.fillStyle=l[2]+'55';for(let j=0;j<3;j++){x.beginPath();x.ellipse(j*430-(cam*.05%430)+120,H*.45+j*70,340,50,0,0,Math.PI*2);x.fill()}x.fillStyle='#25282b';x.fillRect(-cam,H-105,l[3],150);x.fillStyle='#55595d';x.fillRect(-cam,H-105,l[3],3);for(let e of E){if(e.dead)continue;let ex=e.x-cam,ey=e.y;x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.ellipse(ex+18,ey+57,24,7,0,0,Math.PI*2);x.fill();x.fillStyle=e.type===0?'#4d3f38':e.type===1?'#38454d':e.type===2?'#51433e':'#3b3d45';x.fillRect(ex,ey+13,e.w,e.h-13);x.fillStyle='#7b6557';x.beginPath();x.arc(ex+18,ey+10,10,0,7);x.fill()}if(boss&&boss.hp>0){let bx=boss.x-cam;x.fillStyle='#191920';x.fillRect(bx,boss.y,boss.w,boss.h);x.fillStyle='#7d6658';x.beginPath();x.arc(bx+36,boss.y-8,18,0,7);x.fill();x.fillStyle='#b64550';x.fillRect(W*.25,H-45,W*.5*(boss.hp/boss.max),10);x.strokeStyle='#aaa';x.strokeRect(W*.25,H-45,W*.5,10)}let px=P.x-cam,py=P.y;x.save();x.translate(px+17,py+35);x.scale(P.face,1);x.globalAlpha=P.ifr%4<2?.55:1;x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.ellipse(0,31,24,7,0,0,7);x.fill();x.fillStyle='#303840';x.fillRect(-12,-5,24,46);x.fillStyle='#ad8b70';x.beginPath();x.arc(0,-16,10,0,7);x.fill();x.strokeStyle='#c2c5c8';x.lineWidth=4;x.beginPath();x.moveTo(10,2);x.lineTo(P.atk?58:35,P.atk?-8:18);x.stroke();x.restore();for(let q of particles){x.globalAlpha=Math.max(0,q.l/30);x.fillStyle=q.c;x.fillRect(q.x-cam,q.y,q.proj?8:3,q.proj?4:3)}x.globalAlpha=1;x.restore()}function loop(){update();draw();pressed={};requestAnimationFrame(loop)}loop();$('#new').onclick=()=>{S={hp:120,max:120,st:100,p:2,c:0,l:0,cp:80,save:false};start(0)};$('#cont').onclick=()=>{load();start(S.l||0)};$('#ctrl').onclick=()=>{$('#ovtitle').textContent='Controles';$('#ovbody').innerHTML='<div class="controls">A/D ou setas: andar<br>Espaço/W: pular<br>J: ataque leve<br>K: ataque forte<br>Shift: esquiva<br>H: poção<br>E/Enter: avançar diálogo<br>Esc: pausa</div>';$('#overlay').classList.remove('hidden')};$('#chap').onclick=()=>{$('#ovtitle').textContent='Seleção de fase';$('#ovbody').innerHTML='';L.forEach((l,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=(i+1)+' · '+l[0];b.onclick=()=>{$('#overlay').classList.add('hidden');start(i)};$('#ovbody').appendChild(b)});$('#overlay').classList.remove('hidden')};$('#ovclose').onclick=()=>$('#overlay').classList.add('hidden');$('#resume').onclick=()=>{$('#pause').classList.add('hidden');paused=false};$('#back').onclick=()=>{scene='menu';$('#play').classList.add('hidden');$('#menu').classList.remove('hidden');$('#pause').classList.add('hidden');paused=false};addEventListener('keydown',e=>{if((e.code==='KeyE'||e.code==='Enter')&&closeMsg())return;if(e.code==='Escape'&&scene==='game'){paused=!paused;$('#pause').classList.toggle('hidden',!paused)}});load();$('#cont').disabled=!S.save;$('#cont').style.opacity=S.save?1:.45;</script></body></html>
